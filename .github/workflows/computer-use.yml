name: Shared Computer Use
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test --locked --workspace
        working-directory: packages/computer-use
      - run: node packages/computer-use/scripts/build.mjs --debug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . build hatchling pytest pefile
      - run: python -m pytest tests/test_cli_computer_use.py tests/test_computer_use_packaging.py -q
      - name: Build and verify Python platform wheel
        shell: bash
        run: |
          export CRABCODE_COMPUTER_USE_BUNDLE="$PWD/packages/computer-use/dist/$(node -p 'process.platform + "-" + process.arch')"
          python -m build --wheel --no-isolation
          python packages/computer-use/scripts/check-wheel.py dist
      - run: npm ci
        working-directory: packages/vscode
      - run: npm run build
        working-directory: packages/vscode
      - run: node --test tests/computerUse*.test.cjs
        working-directory: packages/vscode
      - run: npm ci
        working-directory: packages/vscode/computer-use
      - run: npm run build
        working-directory: packages/vscode/computer-use
